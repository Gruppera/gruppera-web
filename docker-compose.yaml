services:
  web:
    container_name: gruppera-web
    image: ghcr.io/gruppera/gruppera-online-vibe:${IMAGE_TAG}

    # Traefik ska vara enda ingressen, så vi exponerar bara internt
    expose:
      - "3000"

    environment:
      NODE_ENV: production
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-gruppera.se}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gruppera.se}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    env_file:
      - .env
    restart: unless-stopped

    labels:
      - "traefik.enable=true"

      # HTTPS-router (new.gruppera.se)
      - "traefik.http.routers.gruppera-web.rule=Host(`new.gruppera.se`)"
      - "traefik.http.routers.gruppera-web.entrypoints=websecure"
      - "traefik.http.routers.gruppera-web.tls=true"
      - "traefik.http.routers.gruppera-web.tls.certresolver=letsencrypt"

      # Vilken port appen lyssnar på i containern
      - "traefik.http.services.gruppera-web.loadbalancer.server.port=3000"

      # HTTP -> HTTPS redirect
      - "traefik.http.routers.gruppera-web-http.rule=Host(`new.gruppera.se`)"
      - "traefik.http.routers.gruppera-web-http.entrypoints=web"
      - "traefik.http.routers.gruppera-web-http.middlewares=gruppera-web-https-redirect"
      - "traefik.http.middlewares.gruppera-web-https-redirect.redirectscheme.scheme=https"

    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
    name: traefik-net
